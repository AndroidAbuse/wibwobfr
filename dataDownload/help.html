<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 8px; margin: 20px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Puniemu Account Management</h1>
    <div class="info">
        <p>Use this page to link or restore your account.</p>
    </div>
    <div id="actions">
        <button onclick="doAction('link')">Link Account</button>
        <button onclick="doAction('restore')">Restore Account</button>
    </div>
    <div id="result"></div>
    <script>
        const params = window.__PARAMS__ || {};
        async function doAction(action) {
            const email = prompt('Enter your email:');
            if (!email) return;
            try {
                const resp = await fetch('/auth/' + action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, userId: params.userId })
                });
                const text = await resp.text();
                document.getElementById('result').innerText = text;
            } catch(e) {
                document.getElementById('result').innerText = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
